<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prysm</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="brand">Prysm</span>
        <button id="new-session" class="icon-btn" title="新建会话">+</button>
      </div>
      <div class="sidebar-tabs">
        <div class="tab active" data-tab="sessions">会话</div>
        <div class="tab" data-tab="workspaces">工作区</div>
        <div class="tab" data-tab="skills">技能</div>
        <div class="tab" data-tab="logs">运行</div>
      </div>
      <div class="side-body">
        <div id="tab-sessions" class="tab-pane active">
          <ul id="session-list" class="session-list"></ul>
        </div>
        <div id="tab-workspaces" class="tab-pane">
          <div class="ws-form">
            <input id="ws-root" placeholder="工作区根目录路径" />
            <button id="ws-add" class="sm-btn">添加</button>
          </div>
          <ul id="ws-list" class="ws-list"></ul>
        </div>
        <div id="tab-skills" class="tab-pane">
          <ul id="skill-list" class="skill-list"></ul>
        </div>
        <div id="tab-logs" class="tab-pane">
          <ul id="run-log-list" class="run-log-list"></ul>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="main-head">
        <span id="session-title" class="session-title">新会话</span>
        <span id="session-surface" class="badge">coding</span>
        <span id="streaming-dot" class="streaming-dot" hidden></span>
      </header>
      <div id="messages" class="messages"></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="send" class="send-btn">发送</button>
      </div>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
